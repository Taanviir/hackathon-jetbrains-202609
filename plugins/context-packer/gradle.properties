group = dev.contextpacker
version = 0.1.0

# The IDE ships the Kotlin stdlib; never bundle our own -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.caching = true
# WSL has ~7.6 GB and the sandbox IDE needs its share
org.gradle.jvmargs = -Xmx1536m
kotlin.daemon.jvmargs = -Xmx1024m
