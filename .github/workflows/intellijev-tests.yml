name: IntelliJev tests

on:
  pull_request:
    paths:
      - "plugins/intellijev/**"
      - "plugins/context-packer/src/**"
      - ".github/workflows/intellijev-tests.yml"
  push:
    branches: [main]
    paths:
      - "plugins/intellijev/**"
      - "plugins/context-packer/src/**"
      - ".github/workflows/intellijev-tests.yml"

permissions:
  contents: read

concurrency:
  group: intellijev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/intellijev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build the plugin
        run: ./gradlew test buildPlugin --console=plain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: intellijev
          path: |
            plugins/intellijev/build/distributions/*.zip
            plugins/intellijev/build/reports/tests/
