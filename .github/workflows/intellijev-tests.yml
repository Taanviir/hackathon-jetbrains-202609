name: IntelliJev tests

on:
  pull_request:
    paths:
      - "src/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew*"
      - ".github/workflows/intellijev-tests.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew*"
      - ".github/workflows/intellijev-tests.yml"

permissions:
  contents: read

concurrency:
  group: intellijev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build the root plugin
        run: ./gradlew test buildPlugin --console=plain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: intellijev
          path: |
            build/distributions/*.zip
            build/reports/tests/
